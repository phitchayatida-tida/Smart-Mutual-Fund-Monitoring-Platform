  background-repeat: no-repeat;

  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;

  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);

  const isArray = Array.isArray;

    &quot;codex-visualization-widget-state&quot;,
  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;

  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */

      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },

   * @param {string} property

    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply

  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);

  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs

  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||

          typeof value === &quot;function&quot; ||

      const timeout = globalThis.setTimeout(() =&gt; {

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,

      }),

  };

    postToHost(&quot;height&quot;, {

        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);

                pendingStateWrites.delete(id);

        return;
      }
      hostPort = nextHostPort;

  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;

      element = event.target.parentElement;

    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;

        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }

        target == null ||
        globalThis.navigator.userActivation?.isActive !== true

&lt;/style&gt;
&lt;header&gt;&lt;div class=&quot;fm-top&quot;&gt;&lt;div class=&quot;fm-logo&quot;&gt;&lt;span class=&quot;fm-mark&quot;&gt;&lt;i data-lucide=&quot;chart-no-axes-combined&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&lt;div&gt;Fund&lt;span style=&quot;color:var(--fm-brand)&quot;&gt;Monitor&lt;/span&gt;&lt;div class=&quot;fm-sub&quot;&gt;หน้าสาธิตระบบเบื้องหลัง&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;fm-pill&quot;&gt;Simulation only&lt;/span&gt;&lt;div data-language-switch class=&quot;fm-actions&quot; role=&quot;group&quot; aria-label=&quot;Language / ภาษา&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;fm-button fm-selected cursor-interaction&quot; data-lang=&quot;th&quot; aria-pressed=&quot;true&quot;&gt;ไทย&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;fm-button cursor-interaction&quot; data-lang=&quot;en&quot; aria-pressed=&quot;false&quot;&gt;English&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;nav aria-label=&quot;เมนูหลัก&quot;&gt;&lt;/nav&gt;&lt;/header&gt;
&lt;main&gt;&lt;div id=&quot;fm-view&quot;&gt;&lt;/div&gt;&lt;div id=&quot;fm-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;/main&gt;
&lt;footer&gt;&lt;span&gt;ข้อมูลและโหลดในหน้านี้เป็นการจำลองทั้งหมด • ไม่มีฐานข้อมูลหรือการแจ้งเตือนจริง&lt;/span&gt;&lt;span&gt;ต้นแบบเพื่ออธิบายสถาปัตยกรรม&lt;/span&gt;&lt;/footer&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;fund-backend&#x27;),view=root.querySelector(&#x27;#fm-view&#x27;),status=root.querySelector(&#x27;#fm-status&#x27;);
const funds=[];
let s={lang:&#x27;th&#x27;,page:&#x27;search&#x27;,fund:&#x27;K-CASH-A&#x27;,query:&#x27;&#x27;,type:&#x27;all&#x27;,risk:&#x27;all&#x27;,compare:[],watch:[],range:&#x27;1M&#x27;,form:false,alerts:[],notice:&#x27;&#x27;};
const design={radius:14,density:&#x27;comfortable&#x27;};
const icon=n=&gt;`&lt;i data-lucide=&quot;${n}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
const esc=v=&gt;String(v).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
const num=n=&gt;n.toFixed(4),change=n=&gt;`&lt;span class=&quot;${n&gt;=0?&#x27;fm-up&#x27;:&#x27;fm-down&#x27;}&quot;&gt;${n&gt;=0?&#x27;+&#x27;:&#x27;&#x27;}${n.toFixed(4)}%&lt;/span&gt;`;

let lastSavedSnapshot=&quot;&quot;;
function persist(){lastSavedSnapshot=JSON.stringify({...s,dataVersion:&quot;bilingual-backend-v1&quot;});if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{language:s.lang,surface:&quot;backend&quot;,page:s.page,selectedFund:s.fund,comparison:s.compare,watchlist:s.watch,alertCount:s.alerts.length},privateContent:{...s,dataVersion:&quot;bilingual-backend-v1&quot;}}).catch(()=&gt;{});}
function restore(v){if(v?.privateContent?.dataVersion===&#x27;bilingual-backend-v1&#x27;){const t=v.privateContent;if([&#x27;search&#x27;,&#x27;detail&#x27;,&#x27;compare&#x27;,&#x27;watch&#x27;,&#x27;alerts&#x27;,&#x27;backend&#x27;].includes(t.page)&amp;&amp;Array.isArray(t.watch)&amp;&amp;Array.isArray(t.compare)&amp;&amp;Array.isArray(t.alerts)){s={...s,...t,notice:&#x27;&#x27;};s.watch=s.watch.filter(id=&gt;funds.some(f=&gt;f.id===id));s.compare=s.compare.filter(id=&gt;funds.some(f=&gt;f.id===id));}}}
function toast(t){status.innerHTML=t?`&lt;div class=&quot;fm-toast&quot;&gt;${esc(t)}&lt;/div&gt;`:&#x27;&#x27;;}
function btn(text,action,cls=&#x27;&#x27;,attrs=&#x27;&#x27;){return `&lt;button type=&quot;button&quot; class=&quot;fm-button cursor-interaction ${cls}&quot; data-action=&quot;${action}&quot; ${attrs}&gt;${text}&lt;/button&gt;`;}
function renderNav(){root.querySelector(&#x27;nav&#x27;).innerHTML=&#x27;&#x27;;}

function heading(a,b,actions=&#x27;&#x27;){return `&lt;div class=&quot;fm-row&quot;&gt;&lt;div&gt;&lt;h1&gt;${a}&lt;/h1&gt;&lt;p class=&quot;fm-muted&quot;&gt;${b}&lt;/p&gt;&lt;/div&gt;${actions}&lt;/div&gt;`;}
const backendDefault=()=&gt;({scenario:&#x27;valid&#x27;,step:0,raw:0,queue:0,history:1,quarantine:0,duplicates:0,nav:12.45,version:1,notifications:0,eventId:0,log:[],rate:10000,workers:1,backlog:0,received:0,processed:0,minutes:0});
function bs(){if(!s.backend)s.backend=backendDefault();return s.backend;}
const stages=[&#x27;Data source&#x27;,&#x27;Ingestion&#x27;,&#x27;Message stream&#x27;,&#x27;Processing&#x27;,&#x27;Storage&#x27;,&#x27;API + Alert&#x27;];
function nextEvent(){const b=bs();if(b.step===6)return;b.step++;const kind=b.scenario;let text=&#x27;&#x27;;
if(b.step===1){b.eventId++;text=kind===&#x27;invalid&#x27;?&#x27;รับ ABC-EQ: NAV = -1.0000 (ผิดรูปแบบธุรกิจ)&#x27;:kind===&#x27;duplicate&#x27;?&#x27;รับ event เดิมที่เคยประมวลผลแล้ว&#x27;:kind===&#x27;correction&#x27;?&#x27;รับ correction: NAV 12.6000 ของวันประเมินเดิม&#x27;:&#x27;รับ ABC-EQ: NAV ใหม่ 13.2000&#x27;;}
if(b.step===2){b.raw++;text=&#x27;เก็บ raw payload ใน Object Storage จำลอง&#x27;;}
if(b.step===3){b.queue=1;text=&#x27;เข้าคิว partition ของ ABC-EQ · รอ consumer&#x27;;}
if(b.step===4){b.queue=0;if(kind===&#x27;invalid&#x27;){b.quarantine++;text=&#x27;Validation ไม่ผ่าน → Quarantine; ไม่เขียน NAV&#x27;;}else if(kind===&#x27;duplicate&#x27;){b.duplicates++;text=&#x27;พบ eventId ซ้ำ → ข้าม; ไม่เขียนหรือแจ้งเตือนซ้ำ&#x27;;}else text=&#x27;Schema และ NAV ผ่าน · &#x27;+(kind===&#x27;correction&#x27;?&#x27;ยอมรับ revision ใหม่&#x27;:&#x27;พร้อมบันทึก observation ใหม่&#x27;);}
if(b.step===5){if(kind===&#x27;invalid&#x27;||kind===&#x27;duplicate&#x27;)text=&#x27;ไม่มีการเปลี่ยน Current / History / Outbox&#x27;;else{b.history++;b.version=kind===&#x27;correction&#x27;?b.version+1:1;b.nav=kind===&#x27;correction&#x27;?12.6:13.2;text=&#x27;Commit Current + History + Outbox ใน transaction เดียว (จำลอง)&#x27;;}}
if(b.step===6){if(kind===&#x27;valid&#x27;){b.notifications++;text=&#x27;ส่ง committed update → ล้าง cache → กฎ NAV ≥ 13 ตรงเงื่อนไข → คิวแจ้งเตือนจำลอง&#x27;;}else if(kind===&#x27;correction&#x27;)text=&#x27;API แสดง revision ใหม่; ระงับแจ้งเตือนสำหรับ correction&#x27;;else text=&#x27;API คงค่าเดิม; ไม่มี notification เพิ่ม&#x27;;}
b.log.push({step:b.step,text});b.log=b.log.slice(-6);}
function resetEvent(){const b=bs(),kind=b.scenario;const keep={rate:b.rate,workers:b.workers,backlog:b.backlog,received:b.received,processed:b.processed,minutes:b.minutes};s.backend={...backendDefault(),...keep,scenario:kind};}
function loadMinute(drain=false){const b=bs(),incoming=drain?0:b.rate;b.minutes++;b.received+=incoming;const done=Math.min(b.backlog+incoming,Math.min(b.workers,32)*600*60);b.processed+=done;b.backlog=b.backlog+incoming-done;}
function backend(){const b=bs(),fmt=n=&gt;n.toLocaleString(&#x27;en-US&#x27;);const rejected=[&#x27;invalid&#x27;,&#x27;duplicate&#x27;].includes(b.scenario)&amp;&amp;b.step&gt;=4;
view.innerHTML=heading(&#x27;ระบบเบื้องหลัง&#x27;,&#x27;Architecture demo · สาธิตตามรายงาน หน้า 3–7&#x27;,`&lt;span class=&quot;fm-pill&quot;&gt;Simulation only&lt;/span&gt;`)+`
&lt;div class=&quot;fm-toast&quot;&gt;ทุกขั้นตอนและตัวเลขเป็นการจำลองในหน้าจอ ไม่มี Kafka หรือ Database จริง และไม่ใช่ผลทดสอบ throughput&lt;/div&gt;
&lt;section class=&quot;fm-panel&quot;&gt;&lt;div class=&quot;fm-row&quot;&gt;&lt;h2&gt;01 / ติดตามข้อมูลหนึ่งรายการ&lt;/h2&gt;&lt;span class=&quot;fm-small fm-muted&quot;&gt;ABC-EQ · กฎตัวอย่าง NAV ≥ 13 บาท&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;fm-controls&quot;&gt;&lt;label class=&quot;fm-search&quot;&gt;เหตุการณ์ตัวอย่าง&lt;select id=&quot;fm-scenario&quot;&gt;${[[&#x27;valid&#x27;,&#x27;NAV ใหม่ — ผ่านและแจ้งเตือน&#x27;],[&#x27;invalid&#x27;,&#x27;NAV ติดลบ — ส่ง Quarantine&#x27;],[&#x27;duplicate&#x27;,&#x27;ข้อมูลซ้ำ — Deduplicate&#x27;],[&#x27;correction&#x27;,&#x27;แก้ไขข้อมูลเดิม — เก็บ revision&#x27;]].map(([v,t])=&gt;`&lt;option value=&quot;${v}&quot; ${b.scenario===v?&#x27;selected&#x27;:&#x27;&#x27;}&gt;${t}&lt;/option&gt;`).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/label&gt;&lt;div class=&quot;fm-actions&quot; style=&quot;align-self:end&quot;&gt;${btn(b.step===0?&#x27;เริ่มส่งข้อมูล&#x27;:&#x27;ขั้นถัดไป →&#x27;,&#x27;backend-next&#x27;,&#x27;fm-primary&#x27;,b.step===6?&#x27;disabled&#x27;:&#x27;&#x27;)}${btn(&#x27;เริ่มใหม่&#x27;,&#x27;backend-reset&#x27;)}&lt;/div&gt;&lt;/div&gt;
&lt;ol class=&quot;fm-pipeline&quot; aria-label=&quot;เส้นทางข้อมูล&quot;&gt;${stages.map((name,i)=&gt;`&lt;li class=&quot;${b.step===i+1?&#x27;fm-stage-active&#x27;:&#x27;&#x27;}&quot;&gt;&lt;span class=&quot;fm-step&quot;&gt;${i+1}&lt;/span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;span class=&quot;fm-small fm-muted&quot;&gt;${b.step&lt;i+1?&#x27;รอ&#x27;:b.step===i+1?&#x27;ขั้นตอนปัจจุบัน&#x27;:rejected&amp;&amp;i&gt;=4?&#x27;ไม่เปลี่ยนข้อมูล&#x27;:&#x27;ผ่านขั้นตอนแล้ว&#x27;}&lt;/span&gt;&lt;/li&gt;`).join(&#x27;&#x27;)}&lt;/ol&gt;
&lt;div class=&quot;fm-event-state&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;${b.log.length?esc(b.log[b.log.length-1].text):&#x27;เลือกเหตุการณ์ แล้วกดเริ่มส่งข้อมูล&#x27;}&lt;/div&gt;
&lt;div class=&quot;fm-tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;ส่วนจัดเก็บ (จำลอง)&lt;/th&gt;&lt;th&gt;สถานะปัจจุบัน&lt;/th&gt;&lt;th&gt;หน้าที่&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
